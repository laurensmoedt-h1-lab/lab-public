name: tokentest2
on: { workflow_dispatch: {} }
permissions: read-all
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: dump bodies
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          echo "=== ORG repos?type=private (names + privacy) ==="
          curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/orgs/laurensmoedt-h1-lab/repos?type=private" | python3 -c "import sys,json;d=json.load(sys.stdin);print(\"BODYRESULT\",[(r[\"full_name\"],r[\"private\"]) for r in d] if isinstance(d,list) else d)"
          echo "=== ORG repos?type=all ==="
          curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/orgs/laurensmoedt-h1-lab/repos?type=all" | python3 -c "import sys,json;d=json.load(sys.stdin);print(\"BODYALL\",[(r[\"full_name\"],r[\"private\"]) for r in d] if isinstance(d,list) else d)"
          echo "=== installation token repositories (what this token can see) ==="
          curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/installation/repositories" | python3 -c "import sys,json;d=json.load(sys.stdin);print(\"INSTALLREPOS\",[(r[\"full_name\"],r[\"private\"]) for r in d.get(\"repositories\",[])] if isinstance(d,dict) else d)"